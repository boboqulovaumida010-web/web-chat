
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatly — Messenger</title>
<style>
:root{
 --bg:#101722;--panel:#182331;--panel2:#202e3e;
 --text:#edf3fa;--muted:#91a2b6;--accent:#3988ef;
 --accent2:#246bc7;--border:#2b3a4b;--bubble:#26384c;
 --mine:#1765b9;--hover:#29394b;--shadow:0 15px 50px #0005;
}
body.light{
 --bg:#edf2f8;--panel:#fff;--panel2:#f4f7fb;
 --text:#1c2938;--muted:#78899b;--accent:#327fe0;
 --accent2:#246bc7;--border:#e1e8f0;--bubble:#edf2f8;
 --mine:#d9ebff;--hover:#edf3fa;--shadow:0 15px 50px #172b4518;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,"Segoe UI",Arial,sans-serif;
 height:100vh;overflow:hidden;transition:.25s;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{
 height:100vh;display:grid;
 grid-template-columns:75px 340px minmax(0,1fr);
 max-width:1800px;margin:auto;
 background:var(--panel);
}
.rail{
 background:var(--panel);border-right:1px solid var(--border);
 display:flex;align-items:center;flex-direction:column;
 padding:20px 0;gap:12px;z-index:2;
}
.logo{
 width:46px;height:46px;border-radius:15px;
 background:linear-gradient(135deg,#4a9dff,#6559ed);
 display:grid;place-items:center;font-size:25px;
 box-shadow:0 5px 18px #3988ef55;margin-bottom:22px;
}
.rail-btn{
 width:48px;height:48px;border:0;background:transparent;
 color:var(--muted);border-radius:15px;font-size:21px;
 transition:.2s;position:relative;
}
.rail-btn:hover,.rail-btn.active{
 background:var(--hover);color:var(--accent);
}
.rail-bottom{margin-top:auto}
.sidebar{
 border-right:1px solid var(--border);
 display:flex;flex-direction:column;min-width:0;
 background:var(--panel);
}
.side-head{padding:23px 20px 12px}
.brand-row{display:flex;justify-content:space-between;align-items:center}
.brand-row h2{margin:0;font-size:24px;letter-spacing:-1px}
.brand-row h2 span{color:var(--accent)}
.icon-btn{
 border:0;background:transparent;color:var(--muted);
 width:38px;height:38px;border-radius:12px;font-size:19px;
}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.search{
 display:flex;align-items:center;gap:10px;
 background:var(--panel2);padding:0 13px;border-radius:13px;
 margin-top:19px;height:45px;border:1px solid var(--border);
}
.search input{
 background:none;border:0;outline:0;color:var(--text);
 width:100%;font-size:14px;
}
.filters{display:flex;gap:7px;padding:12px 15px;overflow-x:auto}
.filter{
 white-space:nowrap;border:1px solid var(--border);
 color:var(--muted);background:transparent;border-radius:20px;
 padding:7px 13px;font-size:12px;
}
.filter.active{background:var(--accent);color:white;border-color:var(--accent)}
.chat-list{overflow:auto;flex:1;padding:0 8px 15px}
.chat-item{
 display:flex;gap:12px;align-items:center;padding:12px 10px;
 border-radius:14px;cursor:pointer;transition:.18s;
}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--hover);outline:1px solid var(--border)}
.avatar{
 width:49px;height:49px;border-radius:50%;flex-shrink:0;
 display:grid;place-items:center;font-size:19px;font-weight:700;
 color:white;background:linear-gradient(135deg,#3988ef,#745de9);
 position:relative;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.small{width:36px;height:36px;font-size:14px}
.online-dot{
 width:11px;height:11px;border-radius:50%;background:#35c98a;
 border:2px solid var(--panel);position:absolute;bottom:0;right:0;
}
.chat-info{min-width:0;flex:1}
.chat-top,.chat-bottom{display:flex;justify-content:space-between;gap:6px}
.chat-name{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:10px;color:var(--muted);white-space:nowrap}
.chat-preview{
 color:var(--muted);font-size:12px;margin-top:5px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.unread{
 min-width:19px;height:19px;border-radius:20px;background:var(--accent);
 color:white;font-size:10px;display:grid;place-items:center;padding:0 5px;
}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.welcome{
 flex:1;display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;padding:30px;
}
.welcome-logo{
 width:100px;height:100px;border-radius:30px;
 background:linear-gradient(135deg,#3988ef,#6e58e8);
 display:grid;place-items:center;font-size:48px;
 box-shadow:0 15px 40px #3988ef44;
}
.welcome h1{font-size:35px;margin:25px 0 8px}
.welcome p{color:var(--muted);max-width:400px;line-height:1.7}
.chat-window{display:none;flex:1;min-height:0;flex-direction:column}
.chat-header{
 min-height:76px;padding:12px 22px;display:flex;
 align-items:center;gap:12px;background:var(--panel);
 border-bottom:1px solid var(--border);
}
.header-person{flex:1;min-width:0}
.header-person strong{display:block;font-size:15px}
.header-person small{color:var(--muted);font-size:12px}
.header-actions{display:flex;gap:5px}
.messages{
 flex:1;overflow-y:auto;padding:25px clamp(15px,5vw,70px);
 display:flex;flex-direction:column;gap:13px;
 background-color:var(--bg);
 background-image:radial-gradient(var(--border) .7px,transparent .7px);
 background-size:20px 20px;
}
.date-label{
 align-self:center;background:var(--panel);color:var(--muted);
 border:1px solid var(--border);border-radius:20px;
 padding:6px 15px;font-size:11px;margin:8px 0;
}
.message{
 max-width:min(70%,540px);align-self:flex-start;
 background:var(--panel);border:1px solid var(--border);
 border-radius:16px 16px 16px 4px;padding:10px 13px;
 box-shadow:0 3px 10px #00008;
 position:relative;animation:appear .2s ease;
 overflow-wrap:anywhere;
}
.message.mine{
 align-self:flex-end;background:var(--mine);
 border-color:transparent;border-radius:16px 16px 4px 16px;
}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.message-text{font-size:14px;line-height:1.55;white-space:pre-wrap}
.message-meta{
 text-align:right;color:var(--muted);font-size:10px;margin-top:5px;
}
.mine .message-meta{color:var(--muted)}
.reply-preview{
 border-left:3px solid var(--accent);padding:5px 9px;
 margin-bottom:8px;background:#3988ef12;border-radius:5px;
 font-size:11px;color:var(--muted);
}
.message img{max-width:100%;max-height:260px;object-fit:contain;border-radius:10px}
.message-actions{
 display:flex;gap:4px;position:absolute;top:-34px;right:0;
 background:var(--panel);border:1px solid var(--border);
 border-radius:10px;padding:3px;opacity:0;pointer-events:none;
 transition:.15s;z-index:3;
}
.message:hover .message-actions{opacity:1;pointer-events:auto}
.message-actions button{
 background:none;border:0;color:var(--muted);padding:5px;
 border-radius:5px;font-size:13px;
}
.message-actions button:hover{background:var(--hover);color:var(--text)}
.reaction-row{display:flex;gap:5px;margin-top:6px}
.reaction{
 background:var(--panel);border:1px solid var(--border);
 border-radius:15px;padding:3px 8px;font-size:12px;cursor:pointer;
}
.composer-area{padding:12px 20px 18px;background:var(--panel);border-top:1px solid var(--border)}
.reply-bar{
 display:none;align-items:center;justify-content:space-between;
 padding:8px 12px;margin-bottom:9px;background:var(--panel2);
 border-left:3px solid var(--accent);border-radius:8px;
 font-size:12px;color:var(--muted);
}
.composer{
 display:flex;align-items:flex-end;gap:8px;
 background:var(--panel2);border:1px solid var(--border);
 border-radius:18px;padding:7px 9px;
}
.composer textarea{
 flex:1;min-width:0;max-height:120px;min-height:39px;
 resize:none;border:0;outline:0;background:none;
 color:var(--text);padding:10px 5px;font-size:14px;
}
.send-btn{
 border:0;width:42px;height:42px;border-radius:13px;
 background:var(--accent);color:white;font-size:19px;
}
.send-btn:hover{background:var(--accent2)}
.emoji-panel{
 display:none;position:absolute;bottom:90px;left:20px;
 background:var(--panel);border:1px solid var(--border);
 border-radius:15px;padding:12px;box-shadow:var(--shadow);
 width:270px;z-index:10;grid-template-columns:repeat(8,1fr);gap:5px;
}
.emoji-panel button{border:0;background:none;font-size:21px;padding:5px;border-radius:7px}
.emoji-panel button:hover{background:var(--hover)}
.overlay{
 display:none;position:fixed;inset:0;background:#0008;
 z-index:20;align-items:center;justify-content:center;padding:15px;
}
.modal{
 background:var(--panel);border:1px solid var(--border);
 border-radius:20px;width:min(490px,100%);max-height:85vh;
 overflow:auto;padding:22px;box-shadow:var(--shadow);
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h3{margin:0;font-size:19px}
.field{margin:13px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.field input,.field textarea,.field select{
 width:100%;padding:12px;border-radius:10px;
 background:var(--panel2);border:1px solid var(--border);
 color:var(--text);outline:none;
}
.primary{
 background:var(--accent);color:white;border:0;
 border-radius:10px;padding:11px 17px;font-weight:600;
}
.secondary{
 background:var(--panel2);color:var(--text);
 border:1px solid var(--border);border-radius:10px;padding:10px 15px;
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.setting-row{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;padding:14px 0;border-bottom:1px solid var(--border);
}
.setting-row strong{font-size:13px}
.setting-row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.setting-row input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.setting-row select{background:var(--panel2);color:var(--text);padding:7px;border:1px solid var(--border);border-radius:8px}
.profile-box{text-align:center;padding:15px}
.profile-avatar{
 width:85px;height:85px;border-radius:27px;margin:auto;
 display:grid;place-items:center;font-size:34px;color:white;
 background:linear-gradient(135deg,#3988ef,#745de9);
}
.empty{text-align:center;color:var(--muted);padding:45px 15px;font-size:13px}
.toast{
 position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
 background:#26384c;color:white;padding:12px 20px;
 border-radius:12px;box-shadow:var(--shadow);
 z-index:50;opacity:0;pointer-events:none;transition:.25s;
 font-size:13px;
}
.toast.show{opacity:1}
.mobile-back{display:none}
@media(max-width:850px){
 .app{grid-template-columns:60px 290px minmax(0,1fr)}
 .message{max-width:85%}
}
@media(max-width:620px){
 body{height:100dvh}
 .app{height:100dvh;grid-template-columns:58px minmax(0,1fr)}
 .sidebar{grid-column:2}
 .main{display:none;grid-column:2}
 body.mobile-chat .sidebar{display:none}
 body.mobile-chat .main{display:flex}
 .rail{grid-column:1;grid-row:1}
 .mobile-back{display:block}
 .side-head{padding:17px 12px 8px}
 .chat-list{padding:0 5px}
 .chat-item{padding:10px 7px}
 .chat-header{padding:10px}
 .messages{padding:18px 10px}
 .composer-area{padding:9px}
 .header-actions .optional{display:none}
 .welcome h1{font-size:27px}
}
</style>
</head>
<body>
<div class="app">

<!-- CHAP NAVIGATSIYA -->
<aside class="rail">
 <div class="logo">✦</div>
 <button class="rail-btn active" title="Chatlar" onclick="showSection('all',this)">▤</button>
 <button class="rail-btn" title="Kontaktlar" onclick="showSection('contacts',this)">♙</button>
 <button class="rail-btn" title="Guruhlar" onclick="showSection('groups',this)">♧</button>
 <button class="rail-btn" title="Arxiv" onclick="showSection('archive',this)">▣</button>
 <button class="rail-btn" title="Saqlanganlar" onclick="showSection('saved',this)">☆</button>
 <div class="rail-bottom">
  <button class="rail-btn" title="Sozlamalar" onclick="openSettings()">⚙</button>
  <button class="rail-btn" title="Profil" onclick="openProfile()">●</button>
 </div>
</aside>

<!-- CHATLAR PANELI -->
<aside class="sidebar">
 <div class="side-head">
  <div class="brand-row">
   <h2>Chat<span>ly.</span></h2>
   <div>
    <button class="icon-btn" title="Yangi chat" onclick="newChat()">＋</button>
    <button class="icon-btn" title="Menyu" onclick="openSettings()">⋮</button>
   </div>
  </div>
  <div class="search">
   <span>⌕</span>
   <input id="searchInput" placeholder="Chat, kontakt qidirish..." oninput="renderChats()">
   <button class="icon-btn" onclick="document.getElementById('searchInput').value='';renderChats()">×</button>
  </div>
 </div>
 <div class="filters">
  <button class="filter active" data-filter="all" onclick="setFilter('all',this)">Barchasi</button>
  <button class="filter" data-filter="unread" onclick="setFilter('unread',this)">O‘qilmagan</button>
  <button class="filter" data-filter="personal" onclick="setFilter('personal',this)">Shaxsiy</button>
 </div>
 <div id="chatList" class="chat-list"></div>
</aside>

<!-- ASOSIY CHAT -->
<main class="main">
 <section class="welcome" id="welcome">
  <div class="welcome-logo">✦</div>
  <h1>Chatly Messenger</h1>
  <p>Yaqinlaringiz bilan muloqot qilish uchun chap tomondagi suhbatlardan birini tanlang yoki yangi chat yarating.</p>
  <button class="primary" onclick="newChat()">＋ Yangi suhbat</button>
 </section>
 <section class="chat-window" id="chatWindow">
  <header class="chat-header">
   <button class="icon-btn mobile-back" onclick="backToChats()">‹</button>
   <div class="avatar" id="headAvatar">A</div>
   <div class="header-person">
    <strong id="headName">Ism</strong>
    <small id="headStatus">Chatly foydalanuvchisi</small>
   </div>
   <div class="header-actions">
    <button class="icon-btn" title="Qidirish" onclick="searchInChat()">⌕</button>
    <button class="icon-btn optional" title="Kontakt haqida" onclick="contactInfo()">ⓘ</button>
    <button class="icon-btn" title="Boshqa amallar" onclick="chatMenu()">⋮</button>
   </div>
  </header>
  <div class="messages" id="messages"></div>
  <div class="composer-area">
   <div class="reply-bar" id="replyBar">
    <span id="replyText">Javob berilmoqda...</span>
    <button class="icon-btn" onclick="cancelReply()">×</button>
   </div>
   <div class="emoji-panel" id="emojiPanel"></div>
   <div class="composer">
    <button class="icon-btn" title="Emoji" onclick="toggleEmoji()">☻</button>
    <button class="icon-btn" title="Fayl biriktirish" onclick="document.getElementById('fileInput').click()">＋</button>
    <input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt" onchange="attachFile(event)">
    <textarea id="messageInput" placeholder="Xabar yozing..." rows="1" onkeydown="messageKey(event)"></textarea>
    <button class="send-btn" title="Yuborish" onclick="sendMessage()">➤</button>
   </div>
  </div>
 </section>
</main>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="outsideClose(event)">
 <div class="modal" id="modal">
  <div class="modal-head">
   <h3 id="modalTitle">Chatly</h3>
   <button class="icon-btn" onclick="closeModal()">×</button>
  </div>
  <div id="modalContent"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
// =====================================
// CHATLY — MA'LUMOTLAR
// =====================================
const starterChats=[
 {id:1,name:"Azizbek Karimov",avatar:"A",color:"#3988ef",type:"personal",online:true,unread:2,messages:[
  {id:11,text:"Salom! Qalaysan?",mine:false,time:"10:20"},
  {id:12,text:"Yaxshi, rahmat! O‘zingchi?",mine:true,time:"10:22"},
  {id:13,text:"Bugun yangi loyihani ko‘rib chiqamizmi?",mine:false,time:"10:25"}
 ]},
 {id:2,name:"Dizayn jamoasi",avatar:"D",color:"#9b59b6",type:"group",online:false,unread:4,messages:[
  {id:21,text:"Yangi dizayn tayyor bo‘ldi.",mine:false,time:"09:15"},
  {id:22,text:"Zo‘r! Ko‘rib chiqaman.",mine:true,time:"09:18"}
 ]},
 {id:3,name:"Madina",avatar:"M",color:"#e77c9c",type:"personal",online:true,unread:0,messages:[
  {id:31,text:"Salom, ishlaring yaxshimi?",mine:false,time:"Kecha"},
  {id:32,text:"Ha, hammasi yaxshi 😊",mine:true,time:"Kecha"}
 ]},
 {id:4,name:"Frontend o‘rganamiz",avatar:"F",color:"#269e8a",type:"group",online:false,unread:0,messages:[
  {id:41,text:"Bugun HTML va CSS mavzularini takrorlaymiz.",mine:false,time:"Kecha"}
 ]},
 {id:5,name:"Jasur",avatar:"J",color:"#d48b35",type:"personal",online:false,unread:0,messages:[
  {id:51,text:"Yangi xabarlar bormi?",mine:false,time:"Dushanba"}
 ]}
];

let chats=JSON.parse(localStorage.getItem("chatly_chats")||"null")||starterChats;
let currentId=null;
let filter="all";
let section="all";
let replyTo=null;
let editingId=null;
let user=JSON.parse(localStorage.getItem("chatly_user")||"null")||{
 name:"Chatly foydalanuvchisi",bio:"Chatly'da faol",avatar:"U"
};
let settings=JSON.parse(localStorage.getItem("chatly_settings")||"null")||{
 theme:"dark",font:14,notifications:true,sounds:true,enter:true
};

function save(){
 localStorage.setItem("chatly_chats",JSON.stringify(chats));
 localStorage.setItem("chatly_user",JSON.stringify(user));
 localStorage.setItem("chatly_settings",JSON.stringify(settings));
}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function getChat(id){return chats.find(c=>c.id===id)}
function lastMessage(c){return c.messages[c.messages.length-1]}
function timeNow(){
 return new Date().toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"});
}
function toast(text){
 const t=document.getElementById("toast");
 t.textContent=text;t.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

// =====================================
// CHATLAR RO‘YXATI
// =====================================
function renderChats(){
 const list=document.getElementById("chatList");
 const q=document.getElementById("searchInput").value.toLowerCase();
 let data=chats.filter(c=>{
  if(section==="archive")return c.archived;
  if(section==="saved")return c.saved;
  if(section==="contacts")return c.type==="personal"&&!c.archived;
  if(section==="groups")return c.type==="group"&&!c.archived;
  return !c.archived;
 });
 data=data.filter(c=>{
  if(filter==="unread"&&c.unread===0)return false;
  if(filter==="personal"&&c.type!=="personal")return false;
  return c.name.toLowerCase().includes(q);
 });
 if(!data.length){
  list.innerHTML='<div class="empty">Bu yerda hozircha suhbat yo‘q.</div>';
  return;
 }
 data.sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned));
 list.innerHTML=data.map(c=>{
  const last=lastMessage(c);
  let preview=last?(last.file?"📎 "+last.fileName:last.text):"Hozircha xabar yo‘q";
  return `<div class="chat-item ${currentId===c.id?"active":""}" onclick="openChat(${c.id})">
   <div class="avatar" style="background:${esc(c.color)}">${esc(c.avatar)}
    ${c.online?'<span class="online-dot"></span>':""}
   </div>
   <div class="chat-info">
    <div class="chat-top">
     <span class="chat-name">${c.pinned?"📌 ":""}${esc(c.name)}</span>
     <span class="chat-time">${last?esc(last.time):""}</span>
    </div>
    <div class="chat-bottom">
     <span class="chat-preview">${esc(preview)}</span>
     ${c.unread?`<span class="unread">${c.unread}</span>`:""}
    </div>
   </div>
  </div>`;
 }).join("");
}
function setFilter(value,el){
 filter=value;
 document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");renderChats();
}
function showSection(value,el){
 section=value;filter="all";
 document.querySelectorAll(".rail-btn").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");
 document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
 document.querySelector('[data-filter="all"]').classList.add("active");
 renderChats();
}
function openChat(id){
 currentId=id;replyTo=null;editingId=null;
 const c=getChat(id);if(!c)return;
 c.unread=0;save();
 document.getElementById("welcome").style.display="none";
 document.getElementById("chatWindow").style.display="flex";
 document.getElementById("headName").textContent=c.name;
 document.getElementById("headStatus").textContent=c.type==="group"?"Guruh":"● "+(c.online?"online":"offline");
 const av=document.getElementById("headAvatar");
 av.textContent=c.avatar;av.style.background=c.color;
 document.body.classList.add("mobile-chat");
 renderMessages();renderChats();
}
function backToChats(){document.body.classList.remove("mobile-chat")}

// =====================================
// XABARLAR
// =====================================
function renderMessages(){
 const c=getChat(currentId);if(!c)return;
 const box=document.getElementById("messages");
 box.innerHTML='<div class="date-label">Bugun</div>'+c.messages.map(m=>{
  const reply=m.reply?`<div class="reply-preview">${esc(m.reply)}</div>`:"";
  const content=m.file
   ?(m.fileType.startsWith("image/")?`<img src="${m.file}" alt="Yuborilgan rasm">`:`<div>📎 ${esc(m.fileName)}</div>`)
   :`<div class="message-text">${esc(m.text)}</div>`;
  return `<div class="message ${m.mine?"mine":""}" data-id="${m.id}">
   <div class="message-actions">
    <button onclick="replyMessage(${m.id})" title="Javob berish">↩</button>
    <button onclick="addReaction(${m.id})" title="Reaksiya">☺</button>
    ${m.mine?`<button onclick="editMessage(${m.id})" title="Tahrirlash">✎</button>`:""}
    <button onclick="copyMessage(${m.id})" title="Nusxalash">▢</button>
    <button onclick="deleteMessage(${m.id})" title="O‘chirish">×</button>
   </div>
   ${reply}${content}
   <div class="message-meta">${esc(m.time)} ${m.mine?"✓✓":""}</div>
   ${m.reactions?.length?`<div class="reaction-row">${m.reactions.map(r=>`<span class="reaction">${esc(r)}</span>`).join("")}</div>`:""}
  </div>`;
 }).join("");
 box.scrollTop=box.scrollHeight;
 box.querySelectorAll(".message-text").forEach(el=>el.style.fontSize=settings.font+"px");
}
function sendMessage(){
 const input=document.getElementById("messageInput");
 const text=input.value.trim();
 if(!text||!currentId)return;
 const c=getChat(currentId);
 if(editingId){
  const m=c.messages.find(x=>x.id===editingId);
  if(m)m.text=text;
  editingId=null;toast("Xabar tahrirlandi");
 }else{
  c.messages.push({
   id:Date.now(),text,mine:true,time:timeNow(),
   reply:replyTo?replyTo.text:null,reactions:[]
  });
  toast("Xabar yuborildi");
 }
 input.value="";cancelReply();save();renderMessages();renderChats();
}
function messageKey(e){
 if(e.key==="Enter"&&!e.shiftKey&&settings.enter){
  e.preventDefault();sendMessage();
 }
}
function replyMessage(id){
 const c=getChat(currentId),m=c.messages.find(x=>x.id===id);
 if(!m)return;
 replyTo=m;
 document.getElementById("replyText").textContent="Javob: "+(m.text||"Fayl");
 document.getElementById("replyBar").style.display="flex";
 document.getElementById("messageInput").focus();
}
function cancelReply(){
 replyTo=null;document.getElementById("replyBar").style.display="none";
}
function editMessage(id){
 const c=getChat(currentId),m=c.messages.find(x=>x.id===id);
 if(!m||!m.mine||!m.text)return;
 editingId=id;
 const input=document.getElementById("messageInput");
 input.value=m.text;input.focus();
 toast("Xabarni tahrirlang va yuboring");
}
function deleteMessage(id){
 const c=getChat(currentId);
 if(!confirm("Ushbu xabarni o‘chirmoqchimisiz?"))return;
 c.messages=c.messages.filter(m=>m.id!==id);
 save();renderMessages();renderChats();
}
function copyMessage(id){
 const c=getChat(currentId),m=c.messages.find(x=>x.id===id);
 if(m?.text){
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(m.text).then(()=>toast("Nusxalandi")).catch(()=>toast("Nusxalash imkoni bo‘lmadi"));
  else toast("Brauzer nusxalashni qo‘llab-quvvatlamaydi");
 }
}
function addReaction(id){
 const c=getChat(currentId),m=c.messages.find(x=>x.id===id);
 if(!m)return;
 const choices=["👍","❤️","😂","🔥","👏","😍","😮","😊"];
 const existing=m.reactions||[];
 const choice=choices.find(x=>!existing.includes(x))||"👍";
 m.reactions=[...existing,choice];
 save();renderMessages();
}

// EMOJI VA FAYL
// =====================================
const emojis=["😀","😁","😂","🤣","😊","😍","🥰","😘","😎","🤔","😮","😢","😭","😡","👍","👎","👏","🙏","❤️","💙","💚","🔥","✨","🎉","🌹","⭐","💯","🤝","🙌","☕","🌙","🎵"];
function buildEmoji(){
 document.getElementById("emojiPanel").innerHTML=emojis.map(e=>`<button onclick="insertEmoji('${e}')">${e}</button>`).join("");
}
function toggleEmoji(){
 const p=document.getElementById("emojiPanel");
 p.style.display=p.style.display==="grid"?"none":"grid";
}
function insertEmoji(e){
 const input=document.getElementById("messageInput");
 input.value+=e;input.focus();
}
function attachFile(event){
 const file=event.target.files[0];if(!file||!currentId)return;
 if(file.size>3*1024*1024){
  toast("Demo versiyada fayl hajmi 3 MB dan oshmasin");
  event.target.value="";return;
 }
 const reader=new FileReader();
 reader.onload=()=>{
  const c=getChat(currentId);
  c.messages.push({
   id:Date.now(),mine:true,time:timeNow(),file:reader.result,
   fileType:file.type||"",fileName:file.name,text:""
  });
  save();renderMessages();renderChats();
 };
 reader.readAsDataURL(file);
 event.target.value="";
}

  <div class="field"><label>Chat turi</label>

function createChat(){
 const name=document.getElementById("newName").value.trim();
 if(!name){toast("Ism yoki guruh nomini kiriting");return}
 const id=Date.now();
 const colors=["#3988ef","#9b59b6","#e77c9c","#269e8a","#d48b35","#6d79cf"];
 chats.unshift({
  id,name,avatar:document.getElementById("newAvatar").value||name[0].toUpperCase(),
  color:colors[Math.floor(Math.random()*colors.length)],
  type:document.getElementById("newType").value,
  online:false,unread:0,messages:[]
 });
 save();closeModal();renderChats();openChat(id);
 toast("Yangi suhbat yaratildi");
}

function showModal(title,content){

 document.getElementById("modalContent").innerHTML=content;

// =====================================
// CHAP PANEL BO'LIMLARINI YAXSHILASH
// =====================================

function showSection(value,el){
 section=value;
 filter="all";

 document.querySelectorAll(".rail-btn").forEach(x=>{
   x.classList.remove("active");
 });
 el.classList.add("active");

 document.querySelectorAll(".filter").forEach(x=>{
   x.classList.remove("active");
 });
 document.querySelector('[data-filter="all"]').classList.add("active");

 const titles={
   all:"Barcha suhbatlar",
   contacts:"Kontaktlar",
   groups:"Guruhlar",
   archive:"Arxivlangan suhbatlar",
   saved:"Saqlangan suhbatlar"
 };

 document.querySelector(".brand-row h2").textContent=titles[value];

 renderChats();
}

// Eski renderChats funksiyasini shu bilan almashtir
function renderChats(){
 const list=document.getElementById("chatList");
 const q=document.getElementById("searchInput").value.toLowerCase();

 let data=chats.filter(c=>{
   if(section==="archive") return !!c.archived;
   if(section==="saved") return !!c.saved;
   if(section==="contacts") return c.type==="personal"&&!c.archived;
   if(section==="groups") return c.type==="group"&&!c.archived;
   return !c.archived;
 });

 data=data.filter(c=>{
   if(filter==="unread"&&c.unread===0)return false;
   if(filter==="personal"&&c.type!=="personal")return false;
   return c.name.toLowerCase().includes(q);
 });

 data.sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned));

 if(!data.length){
   list.innerHTML=`
    <div class="empty">
      <div style="font-size:35px;margin-bottom:12px">📂</div>
      <b>${section==="archive"?"Arxiv bo‘sh":
      section==="saved"?"Saqlangan chatlar yo‘q":
      section==="groups"?"Guruhlar yo‘q":
      section==="contacts"?"Kontaktlar yo‘q":"Chatlar yo‘q"}</b>
      <p>Bu bo‘limga hali hech narsa qo‘shilmagan.</p>
      ${section==="groups"?'<button class="primary" onclick="newChat()">＋ Guruh yaratish</button>':""}
    </div>`;
   return;
 }

 list.innerHTML=data.map(c=>{
   const last=lastMessage(c);
   const preview=last?(last.file?"📎 "+last.fileName:last.text):"Hozircha xabar yo‘q";

   return `
   <div class="chat-item ${currentId===c.id?"active":""}"
        onclick="openChat(${c.id})">
     <div class="avatar" style="background:${esc(c.color)}">
       ${esc(c.avatar)}
       ${c.online?'<span class="online-dot"></span>':""}
     </div>
     <div class="chat-info">
       <div class="chat-top">
         <span class="chat-name">${c.pinned?"📌 ":""}${esc(c.name)}</span>
         <span class="chat-time">${last?esc(last.time):""}</span>
       </div>
       <div class="chat-bottom">
         <span class="chat-preview">${esc(preview)}</span>
         ${c.unread?`<span class="unread">${c.unread}</span>`:""}
       </div>
       ${section==="archive"?
       '<small style="color:var(--muted)">Arxivlangan</small>':""}
       ${section==="saved"?
       '<small style="color:var(--accent)">☆ Saqlangan</small>':""}
     </div>
     ${section==="archive"?
       `<button class="icon-btn" title="Arxivdan chiqarish"
       onclick="event.stopPropagation();unarchiveChat(${c.id})">↩</button>`:""}
   </div>`;
 }).join("");
}

function unarchiveChat(id){
 const c=getChat(id);
 if(!c)return;
 c.archived=false;
 save();
 renderChats();
 toast("Chat arxivdan chiqarildi");
}
